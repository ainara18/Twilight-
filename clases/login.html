<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Twilight</title>
    <link rel="stylesheet" href="../Css/login.css?v=3">
</head>
<body>
    <main class="contenedor-login">
        <form method="POST" action="login.php">
            <h2>Iniciar Sesión</h2>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" name="clave" placeholder="********" required>
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>

            <p class="link-login">
                ¿No tienes una cuenta? <a href="registro.html">Regístrate acá</a>
            </p>
            <p class="link-login" style="margin-top: 0.5rem;">
                <a href="../index.php">Volver al inicio</a>
            </p>
        </form>
    </main>
</body>
</html>
