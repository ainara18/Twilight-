<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta — Twilight</title>
    <link rel="stylesheet" href="../Css/registro.css?v=1">
</head>
<body>
    <main class="contenedor-registro">
        <form method="POST" action="registro.php">
            <h2>Crear Cuenta</h2>

            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" name="direccion" placeholder="Calle y número" required>
            </div>

            <div class="form-group">
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" name="clave" placeholder="********" required>
            </div>

            <button type="submit" class="btn-submit">Registrarse</button>

            <p class="link-registro">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión acá</a>
            </p>
            <p class="link-registro" style="margin-top: 0.5rem;">
                <a href="../index.php">Volver al inicio</a>
            </p>
        </form>
    </main>
</body>
</html>
